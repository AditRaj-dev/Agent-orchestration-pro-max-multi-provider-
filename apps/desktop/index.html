<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Engineering OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Pre-paint shell colours, so the first frame is already the right
         theme rather than a white flash that then swaps. */
      html { background: #ffffff; color: #111827; }
      html[data-theme="dark"] { background: #080c10; color: #f0f6fc; }
    </style>
    <script>
      // Stamp the theme before the first paint. React sets the same attribute
      // from an effect, but that runs after the initial render — and elements
      // that already painted under the light tokens do not reliably re-resolve
      // their inherited custom properties when it flips, which left the whole
      // sidebar on light ink inside the dark theme.
      (function () {
        try {
          var saved = window.localStorage.getItem("agentos_theme");
          var theme =
            saved === "dark" || saved === "light"
              ? saved
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.className = "theme-" + theme;
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
