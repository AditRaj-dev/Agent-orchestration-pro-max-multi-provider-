[package]
name = "agentos-desktop"
version = "0.1.0"
description = "Agent Engineering OS Desktop Command Center"
authors = ["Agent Engineering OS Team"]
edition = "2021"

[lib]
name = "agentos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-dialog = "2.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
