[package]
name = "agentos-daemon"
description = "F-01: daemon core — SQLite state, append-only event journal, process supervision"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agentos-core = { path = "../agentos-core" }
tokio = { workspace = true, features = ["net"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# F-11a WebSocket surface (docs/F-11-desktop.md). Explicit versions, not
# workspace deps: a parallel session may be editing the root manifest.
futures-util = "0.3"
tokio-tungstenite = "0.26"

[dev-dependencies]
tempfile = { workspace = true }
